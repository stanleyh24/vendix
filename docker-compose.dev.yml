version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vendix-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vendix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vendix-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vendix-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vendix-api-dev
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: vendix
      DB_SSL_MODE: disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      JWT_SECRET: dev-secret-change-in-production
      LOG_LEVEL: debug
    volumes:
      # Montar el código fuente para hot-reload
      - ./:/app
      # Excluir tmp para evitar conflictos
      - /app/tmp
      # Cache de módulos de Go
      - go_modules_cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vendix-worker-dev
    environment:
      APP_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: vendix
      DB_SSL_MODE: disable
      REDIS_ADDR: redis:6379
      LOG_LEVEL: debug
    volumes:
      # Montar el código fuente para hot-reload
      - ./:/app
      # Excluir tmp para evitar conflictos
      - /app/tmp
      # Cache de módulos de Go
      - go_modules_cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["air", "-c", ".air.worker.toml"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: vendix-frontend-dev
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      # Montar el código fuente para hot-reload
      - ./frontend:/app
      # Excluir node_modules para usar los del contenedor
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data_dev:
  redis_data_dev:
  minio_data_dev:
  go_modules_cache:

